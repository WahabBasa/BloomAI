# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions
#
# Manual trigger only. The Azure App Service this deploys to has been torn
# down, so running on every push to main only put a red X on every commit.
# The workflow is kept so the deployment can be re-created and this run from
# the Actions tab -- restore the `push` trigger at that point.

name: Build and deploy Python app to Azure Web App - bloomai-hackathon-prd-wa-uaen-01

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Optional: Add step to run tests here (PyTest, Django test suites, etc.)

      - name: Zip artifact for deployment
        # The venv exclusions matter because Azure builds its own environment;
        # the .env exclusion matters more, since a build artifact is
        # downloadable by anyone with read access to the repo's Actions tab.
        run: |
          zip release.zip ./* -r \
            -x 'venv/*' '*/venv/*' '.venv/*' '*/.venv/*' \
            -x '.env' '*/.env' \
            -x '*.pyc' '*__pycache__*' \
            -x '*/node_modules/*' '*/db.sqlite3'

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'bloomai-hackathon-prd-wa-uaen-01'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F88DD412558343779A23DBE82794A9C9 }}
